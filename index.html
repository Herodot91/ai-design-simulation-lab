<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Design Simulation Lab</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #6366f1; --accent2: #22d3ee; --ok: #34d399; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--border); padding: 18px 20px; overflow-y: auto; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lang { display: flex; gap: 4px; flex: none; }
  .lang button { flex: none; padding: 4px 8px; font-size: 11px; font-weight: 700; border-radius: 6px; }
  .lang button.active { background: var(--accent); border-color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
  .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .tabs button { grid-column: span 2; }
  .tabs button.half { grid-column: span 3; }
  .tabs button { padding: 7px 4px; font-size: 11.5px; line-height: 1.2; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .tabs button.done { border-color: var(--ok); }
  .tabs .num { display: block; font-size: 11px; color: var(--accent2); font-weight: 700; letter-spacing: .06em; }
  .tabs button.active .num { color: #fff; }
  .tabs .ic { display: block; font-size: 17px; }
  .flow { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .lesson { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 13px;
    line-height: 1.5; margin-top: 14px; }
  .lesson b { color: var(--accent2); }
  .lesson .metaphor { color: var(--muted); font-style: italic; margin-top: 6px; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: var(--muted); }
  input[type=text], select, textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .chip, .scr, .seg, .mood, .pal { flex: none; padding: 5px 10px; border-radius: 99px; font-size: 12px; }
  .scr.active, .seg.active, .mood.active, .pal.active { background: var(--accent); border-color: var(--accent); }
  .pal { display: inline-flex; align-items: center; gap: 6px; }
  .pal i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,.4); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; color: var(--text); }
  .status { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border); }
  .status.ok { border-color: var(--ok); color: var(--ok); }
  .status.bad { border-color: var(--warn); color: var(--warn); }
  .status.note { color: var(--muted); }
  .panel { display: none; }
  .panel.on { display: block; }
  #variants { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  #variants canvas { width: 100%; border-radius: 10px; border: 2px solid var(--border); cursor: pointer; background: #fff; display: block; }
  #variants canvas:hover { border-color: var(--accent2); }
  main { position: relative; background: #0b1220; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; }
  .view.on { display: flex; }
  .view canvas.flat { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #stage { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #view6 { padding: 0; }
  #haze { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .hint, .badge { position: absolute; font-size: 12px; background: rgba(15,23,42,.75); padding: 6px 12px;
    border-radius: 99px; pointer-events: none; z-index: 5; }
  .hint { left: 50%; bottom: 16px; transform: translateX(-50%); color: var(--muted); max-width: 90%; text-align: center; }
  .badge { top: 16px; right: 16px; color: var(--accent2); }
  #photoStage { position: relative; display: block; user-select: none; }
  #photoImg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #shot { position: absolute; left: 0; top: 0; width: 400px; height: 800px; transform-origin: 0 0; overflow: hidden;
    border-radius: 46px; pointer-events: none; box-shadow: inset 0 0 60px rgba(0,0,0,.28); }
  #shotCv { width: 400px; height: 800px; display: block; }
  #cut { position: absolute; background: #050507; display: none; }
  #gloss { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.14) 100%); }
  .handle { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(99,102,241,.85);
    border: 2px solid #fff; color: #fff; font: 700 9px/22px Inter, sans-serif; text-align: center; cursor: move; touch-action: none; }
  #credit { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: rgba(255,255,255,.7); text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #credit a { color: inherit; }
  #view8 { align-items: flex-start; overflow: auto; }
  #cmp { width: 100%; max-width: 1200px; margin: 0 auto; padding: 8px 8px 40px; }
  #cmp h3 { margin: 6px 0 4px; font-size: 22px; }
  #cmp .cmpsub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .cmp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .cmp-key, .cmp-warn, .cmp-order { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
  .cmp-warn { border-color: var(--warn); color: var(--warn); margin-top: 16px; }
  .cmp-order { color: var(--accent2); margin-top: 0; }
  .cmp-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; }
  .cmp-card:hover { border-color: var(--accent2); }
  .cmp-card h4 { margin: 10px 0 4px; font-size: 14px; }
  .cmp-card h5 { margin: 8px 0 0; font-size: 13px; color: var(--accent2); }
  .cmp-card p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .cmp-tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); margin-bottom: 6px; font-weight: 700; }
  .cmp-tag.soft { color: var(--accent2); margin-top: 12px; }
  .cmp-img { border-radius: 10px; overflow: hidden; background: #e5e7eb; aspect-ratio: 3 / 2; }
  .cmp-img img, .cmp-img canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cmp-arrow { text-align: center; color: var(--muted); margin-top: 8px; font-size: 18px; }
  .focusBtn { position: absolute; top: 12px; left: 12px; z-index: 6; flex: none; padding: 6px 12px; border-radius: 99px; font-size: 12px; background: rgba(15,23,42,.85); }
  .app.focus { grid-template-columns: 1fr; }
  .app.focus aside { display: none; }
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .app { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; height: 100vh; }
    main { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--border); min-height: 0; }
    .app.focus { grid-template-rows: 1fr; }
    .cmp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="top">
      <h1 data-i18n="app.title"></h1>
      <div class="lang" id="lang"><button data-lang="en">EN</button><button data-lang="ro">RO</button><button data-lang="fr">FR</button></div>
    </div>
    <div class="sub" data-i18n="app.sub"></div>

    <div class="tabs" id="tabs">
      <button data-step="1"><span class="num">01</span><span class="ic">🎯</span><span data-i18n="tab.1"></span></button>
      <button data-step="2"><span class="num">02</span><span class="ic">✍️</span><span data-i18n="tab.2"></span></button>
      <button data-step="3"><span class="num">03</span><span class="ic">🗂️</span><span data-i18n="tab.3"></span></button>
      <button data-step="4"><span class="num">04</span><span class="ic">📐</span><span data-i18n="tab.4"></span></button>
      <button data-step="5"><span class="num">05</span><span class="ic">🎨</span><span data-i18n="tab.5"></span></button>
      <button data-step="6"><span class="num">06</span><span class="ic">⚡</span><span data-i18n="tab.6"></span></button>
      <button data-step="7" class="half"><span class="num">07</span><span class="ic">🖼️</span><span data-i18n="tab.7"></span></button>
      <button data-step="8" class="half"><span class="num">🚗</span><span class="ic">⇄</span><span data-i18n="tab.8"></span></button>
    </div>
    <div class="flow" data-i18n="flow"></div>

    <!-- STAGE 01 -->
    <section class="panel" data-step="1">
      <div class="lesson"><b data-i18n="s1.title"></b> <span data-i18n="s1.desc"></span>
        <div class="metaphor" data-i18n="s1.note"></div></div>
      <h2 data-i18n="s1.moods"></h2>
      <div class="row" id="moods"></div>
      <div class="row"><button class="primary" id="btnSuggest" data-i18n="s1.suggest"></button></div>
      <h2 data-i18n="s1.palette"></h2>
      <div class="row" id="pals"></div>
      <label for="shape" data-i18n="s1.shape"></label>
      <select id="shape"><option value="round" data-i18n="shape.round"></option><option value="sharp" data-i18n="shape.sharp"></option></select>
      <label for="font" data-i18n="s1.font"></label>
      <select id="font"><option value="sans" data-i18n="font.sans"></option><option value="serif" data-i18n="font.serif"></option><option value="round" data-i18n="font.round"></option></select>
    </section>

    <!-- STAGE 02 · CONCEPT SKETCHING -->
    <section class="panel" data-step="2">
      <div class="lesson"><b data-i18n="s2.title"></b> <span data-i18n="s2.desc"></span>
        <div class="metaphor" data-i18n="s2.note"></div></div>
      <div class="status note" data-i18n="s2.pick"></div>
      <div class="status" id="skStatus"></div>
      <div class="status note" data-i18n="s2.iter"></div>
    </section>

    <!-- STAGE 03 · INFORMATION ARCHITECTURE -->
    <section class="panel" data-step="3">
      <div class="lesson"><b data-i18n="s3.title"></b> <span data-i18n="s3.desc"></span>
        <div class="metaphor" data-i18n="s3.note"></div></div>
      <label for="homeScreen" data-i18n="s3.home"></label>
      <select id="homeScreen">
        <option value="map" data-i18n="scr.map"></option>
        <option value="ticket" data-i18n="scr.ticket"></option>
        <option value="routes" data-i18n="scr.routes"></option>
      </select>
      <div class="status" id="iaStatus"></div>
      <div class="status note" data-i18n="excl"></div>
    </section>

    <!-- STAGE 03 -->
    <section class="panel" data-step="4">
      <div class="lesson"><b data-i18n="s4.title"></b> <span data-i18n="s4.desc"></span>
        <div class="metaphor" data-i18n="s4.note"></div></div>
      <div class="row"><button class="seg" id="wfSketch" data-i18n="s4.sketch"></button><button class="seg active" id="wfClean" data-i18n="s4.clean"></button></div>
      <label class="check"><input type="checkbox" id="chkNotes" checked> <span data-i18n="s4.notes"></span></label>
      <div class="status" id="wireStatus"></div>
    </section>

    <!-- STAGE 04 -->
    <section class="panel" data-step="5">
      <div class="lesson"><b data-i18n="s5.title"></b> <span data-i18n="s5.desc"></span></div>
      <label for="pname" data-i18n="s5.name"></label>
      <input type="text" id="pname" maxlength="24">
      <label for="route" data-i18n="s5.route"></label>
      <select id="route"></select>
      <div class="row"><button id="btnQR" data-i18n="s5.qr"></button></div>
      <div class="status" id="uiStatus"></div>
      <div class="status note" data-i18n="s5.tip"></div>
    </section>

    <!-- STAGE 05 -->
    <section class="panel" data-step="6">
      <div class="lesson"><b data-i18n="s6.title"></b> <span data-i18n="s6.desc"></span></div>

      <h2 data-i18n="s6.variants"></h2>
      <label for="aiPrompt" data-i18n="s6.prompt"></label>
      <input type="text" id="aiPrompt" data-i18n-ph="s6.promptph">
      <div class="row"><button class="primary" id="btnVariants" data-i18n="s6.gen"></button></div>
      <div id="variants"></div>
      <div class="status note" data-i18n="s6.simnote"></div>

      <h2 data-i18n="s6.view"></h2>
      <div class="row"><button class="seg active" id="modePhoto" data-i18n="s6.photo"></button><button class="seg" id="mode3d" data-i18n="s6.m3d"></button></div>
      <div id="ctlPhoto">
        <div class="row"><button class="seg" data-scene="sit" data-i18n="s6.sit"></button><button class="seg" data-scene="hand" data-i18n="s6.hand"></button></div>
        <div class="row"><button id="btnUpload" data-i18n="s6.upload"></button><input type="file" id="fileIn" accept="image/*" hidden></div>
        <label class="check"><input type="checkbox" id="adjust"> <span data-i18n="s6.adjust"></span></label>
        <label for="bright" data-i18n="s6.bright"></label><input type="range" id="bright" min="0.6" max="1.3" step="0.02" value="0.95">
        <label for="glare" data-i18n="s6.glare"></label><input type="range" id="glare" min="0" max="1" step="0.02" value="0.5">
      </div>
      <h2 data-i18n="s6.proto"></h2>
      <div class="status note" data-i18n="s6.protonote"></div>
      <div class="row">
        <button class="scr" data-screen="map" data-i18n="s6.bmap"></button>
        <button class="scr" data-screen="ticket" data-i18n="s6.bticket"></button>
        <button class="scr" data-screen="routes" data-i18n="s6.broutes"></button>
      </div>
      <label for="envPrompt" data-i18n="s6.env"></label>
      <textarea id="envPrompt" rows="2"></textarea>
      <div class="row"><button class="primary" id="btnRender" data-i18n="s6.scene"></button></div>
      <div class="row" id="envChips"></div>
      <div class="status" id="interp"></div>
      <div id="ctl3d" style="display:none"><label for="light" data-i18n="s6.light"></label>
      <input type="range" id="light" min="0" max="2.5" step="0.05" value="1">
      <label for="depth" data-i18n="s6.haze"></label>
      <input type="range" id="depth" min="0" max="1" step="0.02" value="0.4">
      <label class="check"><input type="checkbox" id="blurBg" checked> <span data-i18n="s6.blur"></span></label>
      <label for="spin" data-i18n="s6.spin"></label>
      <input type="range" id="spin" min="0" max="2" step="0.05" value="0.4">
      <label class="check"><input type="checkbox" id="auto" checked> <span data-i18n="s6.auto"></span></label>
      <div class="row"><button id="btnReset" data-i18n="s6.reset"></button></div></div>
    </section>

    <!-- STAGE 06 -->
    <section class="panel" data-step="7">
      <div class="lesson"><b data-i18n="s7.title"></b> <span data-i18n="s7.desc"></span>
        <div class="metaphor" data-i18n="s7.note"></div></div>
      <div class="row"><button class="primary" id="btnBoard" data-i18n="s7.download"></button></div>
    </section>

    <!-- COMPARE -->
    <section class="panel" data-step="8">
      <div class="lesson"><b data-i18n="cmp.title"></b> <span data-i18n="cmp.lesson"></span></div>
    </section>

    <div class="row" id="navRow">
      <button id="btnPrev" data-i18n="nav.back"></button>
      <button class="primary" id="btnNext" data-i18n="nav.next"></button>
    </div>
  </aside>

  <main>
    <div class="view" id="view1"><canvas class="flat" id="moodCv" width="1000" height="600"></canvas></div>
    <div class="view" id="view2"><canvas class="flat" id="skCv" width="1000" height="600" style="cursor:pointer"></canvas></div>
    <div class="view" id="view3"><canvas class="flat" id="iaCv" width="1000" height="600"></canvas></div>
    <div class="view" id="view4"><canvas class="flat" id="wire" width="1000" height="600"></canvas></div>
    <div class="view" id="view5"><canvas class="flat" id="mockView" width="1000" height="600" style="cursor:pointer"></canvas></div>
    <div class="view" id="view6">
      <canvas id="stage"></canvas><div id="haze"></div>
      <div id="photoStage"><img id="photoImg" alt="" crossorigin="anonymous"><div id="shot"><canvas id="shotCv" width="400" height="800"></canvas><div id="cut"></div><div id="gloss"></div></div><div id="handles"></div></div>
      <div id="credit">Photos: <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a></div>
    </div>
    <div class="view" id="view7"><canvas class="flat" id="boardCv" width="1000" height="600"></canvas></div>
    <div class="view" id="view8">
      <div id="cmp">
        <h3 data-i18n="cmp.title"></h3>
        <p class="cmpsub" data-i18n="cmp.sub"></p>
        <div class="cmp-key" data-i18n="cmp.key"></div>
        <div class="cmp-grid">
          <div class="cmp-card" data-go="1">
            <h4 data-i18n="cmp.t1"></h4>
            <div class="cmp-tag" data-i18n="cmp.car"></div>
            <div class="cmp-img"><canvas id="autoMood" width="600" height="400"></canvas></div>
            <p data-i18n="cmp.a1"></p>
            <div class="cmp-arrow">⇅</div>
            <div class="cmp-tag soft" data-i18n="cmp.sw"></div>
            <div class="cmp-img"><canvas id="cmpCv1" width="600" height="400"></canvas></div>
            <p data-i18n="cmp.s1"></p>
          </div>
          <div class="cmp-card" data-go="2">
            <h4 data-i18n="cmp.t2"></h4>
            <div class="cmp-tag" data-i18n="cmp.car"></div>
            <div class="cmp-img"><img src="images/1.webp" alt=""></div>
            <p data-i18n="cmp.a2"></p>
            <div class="cmp-arrow">⇅</div>
            <div class="cmp-tag soft" data-i18n="cmp.sw"></div>
            <div class="cmp-img"><canvas id="cmpCv2" width="600" height="400"></canvas></div>
            <p data-i18n="cmp.s2"></p>
          </div>
          <div class="cmp-card" data-go="4">
            <h4 data-i18n="cmp.t3"></h4>
            <div class="cmp-tag" data-i18n="cmp.car"></div>
            <div class="cmp-img"><canvas id="autoWire" width="600" height="400"></canvas></div>
            <p data-i18n="cmp.a3"></p>
            <div class="cmp-arrow">⇅</div>
            <div class="cmp-tag soft" data-i18n="cmp.sw"></div>
            <div class="cmp-img"><canvas id="cmpCv3" width="600" height="400"></canvas></div>
            <p data-i18n="cmp.s3"></p>
          </div>
          <div class="cmp-card" data-go="5">
            <h4 data-i18n="cmp.t4"></h4>
            <div class="cmp-tag" data-i18n="cmp.car"></div>
            <div class="cmp-img"><img src="images/3.webp" alt=""></div>
            <p data-i18n="cmp.a4"></p>
            <div class="cmp-arrow">⇅</div>
            <div class="cmp-tag soft" data-i18n="cmp.sw"></div>
            <div class="cmp-img"><canvas id="cmpCv4" width="600" height="400"></canvas></div>
            <p data-i18n="cmp.s4"></p>
          </div>
          <div class="cmp-card" data-go="6">
            <h4 data-i18n="cmp.t5"></h4>
            <div class="cmp-tag" data-i18n="cmp.car"></div>
            <div class="cmp-img"><img src="images/2.webp" alt=""></div>
            <p data-i18n="cmp.a5"></p>
            <div class="cmp-arrow">⇅</div>
            <div class="cmp-tag soft" data-i18n="cmp.sw"></div>
            <div class="cmp-img"><canvas id="cmpCv5" width="600" height="400"></canvas></div>
            <p data-i18n="cmp.s5"></p>
          </div>
        </div>
        <div class="cmp-warn" data-i18n="cmp.warn"></div>
        <div class="cmp-order" data-i18n="cmp.order"></div>
      </div>
    </div>
    <button class="focusBtn" id="btnFocus"></button>
    <div class="badge" id="badge"></div>
    <div class="hint" id="hint"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/RGBELoader.js"></script>
<script>
(function () {
  /* =================== I18N (EN · RO · FR) =================== */
  const $ = (id) => document.getElementById(id);

  $('btnPrev').onclick = () => goStep(step - 1);
  $('btnNext').onclick = () => goStep(step + 1);

  function setWf(sketch) { S.sketch = sketch; $('wfSketch').classList.toggle('active', sketch); $('wfClean').classList.toggle('active', !sketch); drawWire(); scheduleDerived(); }
  $('wfSketch').onclick = () => setWf(true);
  $('wfClean').onclick = () => setWf(false);
  $('chkNotes').onchange = (e) => { S.notes = e.target.checked; drawWire(); };
  $('homeScreen').onchange = (e) => { S.home = e.target.value; current = S.home; redrawAll(); };
  $('shape').onchange = (e) => { S.shape = e.target.value; redrawAll(); };
  $('font').onchange = (e) => { S.font = e.target.value; redrawAll(); };
  $('pname').addEventListener('input', (e) => { S.name = e.target.value; S.nameEdited = true; drawMock(); });
  $('route').onchange = (e) => { S.route = e.target.selectedIndex; drawMock(); };
  $('btnQR').onclick = () => { S.qrSeed = 1 + Math.floor(Math.random() * 99999); drawMock(); };
  $('btnSuggest').onclick = suggestStyle;
  $('btnVariants').onclick = genVariants;
  $('photoImg').addEventListener('load', scheduleDerived);

  const appEl = document.querySelector('.app');
  function updFocus() { $('btnFocus').textContent = '⤢ ' + t(appEl.classList.contains('focus') ? 'focus.off' : 'focus.on'); }
  function toggleFocus() {
    appEl.classList.toggle('focus'); updFocus();
    dispatchEvent(new Event('resize')); setTimeout(() => dispatchEvent(new Event('resize')), 60);
  }
  $('btnFocus').onclick = toggleFocus;
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && appEl.classList.contains('focus')) toggleFocus(); });

  function setLang(l) {
    LANG = l; try { localStorage.setItem('lab-lang', l); } catch (e) { /* ignore */ }
    applyI18n(); buildMoods(); buildPals(); buildRouteSelect(); buildEnvChips();
    $('pname').placeholder = t('ui.name');
    if (!envEdited) $('envPrompt').value = t('s6.envdef');
    syncControls(); redrawAll();
    if (variantList.length) renderVariants();
    if (ENV.data) setStatus($('interp'), true, t('env.interp', ENV.label || ''));
    updateHint(); updFocus();
  }
  let envEdited = false;
  $('envPrompt').addEventListener('input', () => { envEdited = true; });
  document.querySelectorAll('#lang button').forEach((b) => b.onclick = () => setLang(b.dataset.lang));

  /* ---- init ---- */
  applyI18n(); buildMoods(); buildPals(); buildRouteSelect(); buildEnvChips();
  $('pname').placeholder = t('ui.name'); $('envPrompt').value = t('s6.envdef');
  syncStyle(); syncControls(); redrawAll();
  setScene('sit'); setMode('photo');
  applyEnv(interpret($('envPrompt').value).env);
  genVariants();
  updFocus();
  goStep(1);
})();
</script>
</body>
</html>
